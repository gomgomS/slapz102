<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ data.site_name }}{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;1,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='v2/app.output.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/favicon.svg') }}">
    <meta property="og:title" content="{% block og_title %}{{ data.site_name }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Flask + MongoDB boilerplate{% endblock %}">
    <meta property="og:image" content="{{ data.og_image }}">
    <meta property="og:url" content="{{ data.og_url }}">
</head>
<body class="bg-white text-black antialiased">
    <header class="border-b border-line">
        <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-4">
            <a href="/" class="font-mono text-sm font-semibold uppercase tracking-widest">
                {{ data.site_name }}
            </a>
            <span class="font-mono text-xs uppercase tracking-widest text-mute">
                Flask &middot; MongoDB
            </span>
        </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-line">
        <div class="mx-auto max-w-3xl px-4 py-6 font-mono text-xs uppercase tracking-widest text-mute">
            SLAPZ Framework &middot; slapz102
        </div>
    </footer>
</body>
</html>
